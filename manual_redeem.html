{% extends "base.html" %}

{% block title %}Redeem Your Mnemonic Phrase{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Redeem Your Mnemonic Phrase</h2>
            </div>
            <div class="card-body">
                <p class="text-center mb-4">Enter the 4-word phrase you received to redeem your money.</p>
                
                <form method="POST" action="{{ url_for('redemption.verify_phrase') }}">
                    <div class="mb-3">
                        <label for="phrase" class="form-label">4-Word Phrase</label>
                        <input type="text" class="form-control" id="phrase" name="phrase" 
                               placeholder="e.g., apple banana orange grape" required>
                        <div class="form-text">Enter the exact 4 words you received, separated by spaces</div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Verify Phrase</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
